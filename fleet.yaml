apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: nebula-fleet
spec:
  replicas: 3
  template:
    spec:
      ports:
        - name: game
          containerPort: 7654
          protocol: TCP          # WebSocket viaja sobre TCP
      health: { initialDelaySeconds: 10, periodSeconds: 5 }
      template:
        spec:
          containers:
            - name: nebula
              image: 906048429598.dkr.ecr.us-east-1.amazonaws.com/nebula-server:026234cdf1e8514ad8c64404aee708cc9fb893fd
              ports:
                - name: metrics  # lo leerá Prometheus en la práctica 3.4
                  containerPort: 9100
              resources:
                requests: { cpu: "250m", memory: "256Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
